name: CI

# A pull request runs once (pull_request); main and dev are checked again
# after the merge.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Python version Pyodide 0.26 brings (see src/pyodide-worker.js), so
      # the runtime checks run the same language version as the browser.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # npm ci also builds the library once (the "prepare" script).
      - run: npm ci
      - run: npm run lint
      - run: npm run build:embed
      # Builds the library again and checks the embed protocol against dist/.
      - run: npm run test:protocol
      # The static tree pictures (renderTreeSvg, glpython-tree) against their
      # snapshots, treeLayout's positions and CPython's repr, with that build.
      - run: npm run test:svg
      # The hints' wording in German and English, against that build.
      - run: npm run test:hints
      # The runtime under CPython: the visualizer's columns, docstrings,
      # condition comments, readable types and argument checks, the doctest
      # runner and its coverage, and which errors get a hint.
      - run: npm run test:runtime
      # The trees' layout (our port of van der Ploeg's algorithm) against
      # d3-flextree, on the course's trees and random ones.
      - run: npm run test:layout
      # The visualizer's mode «Baum» on traces of the runtime: its steps are
      # «Ersetzung»'s plus open and close, its text the chain's, and a
      # reduction moves no node.
      - run: npm run test:tree
      # The console in Chrome (on the runner) with Pyodide from its CDN,
      # driving the embed built above: Tests → edit → Tests shows the new
      # report (P20).
      - run: npm run test:console
      - name: Not checked here
        run: |
          echo "::notice title=Not run in CI::Needs Pyodide in a browser, so apart from test:console it isn't checked here: the worker (run, REPL, input() bridge, gturtle) and the UI. Check these in the embed preview (npm run build:embed && npm run preview:embed)."
